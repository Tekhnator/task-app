plugins { id 'com.android.application' }

android {
    namespace 'ru.sanya.app'
    compileSdk 34
    defaultConfig {
        applicationId 'ru.sanya.app'
        minSdk 24
        targetSdk 34
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger())
        versionName '1.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    signingConfigs {
        release {
            storeFile file('../signing.jks')
            storePassword '2f0FleZS5Rz2wG_4jCSG5p5f'
            keyAlias 'sanya'
            keyPassword '2f0FleZS5Rz2wG_4jCSG5p5f'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.alphacephei:vosk-android:0.3.47@aar'
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
}
