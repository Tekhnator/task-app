name: Sanya APK
on:
  push:
    branches: [main]
    paths: ['sanya-android/**', '.github/workflows/sanya-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Russian speech model (Vosk, offline)
        run: |
          curl -sSL -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip
          unzip -q model.zip
          mkdir -p sanya-android/app/src/main/assets
          mv vosk-model-small-ru-0.22 sanya-android/app/src/main/assets/model-ru
          echo "small-ru-0.22" > sanya-android/app/src/main/assets/model-ru/uuid
          du -sh sanya-android/app/src/main/assets/model-ru
      - name: Music (CC0, OpenGameArt)
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          mkdir -p m sanya-android/app/src/main/assets/music
          curl -sSL --fail -o m/n1.mp3 "https://opengameart.org/sites/default/files/outer_space_2.mp3"
          curl -sSL --fail -o m/n2.wav "https://opengameart.org/sites/default/files/Baby%20Song.wav"
          curl -sSL --fail -o m/d1.ogg "https://opengameart.org/sites/default/files/Birds%2C%20Wind%20and%20Synth%20V2_0.ogg"
          curl -sSL --fail -o m/d2.flac "https://opengameart.org/sites/default/files/lost%20in%20the%20meadows_0.flac"
          for f in m/*; do b=$(basename "${f%.*}")
            ffmpeg -loglevel error -y -i "$f" -ac 1 -ar 44100 -af loudnorm=I=-24:TP=-2 -c:a libvorbis -q:a 3 "sanya-android/app/src/main/assets/music/$b.ogg"
          done
          ls -la sanya-android/app/src/main/assets/music
      - name: Build APK
        run: gradle -p sanya-android assembleRelease --no-daemon --stacktrace
      - run: cp sanya-android/app/build/outputs/apk/release/app-release.apk Sanya.apk
      - name: Publish release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete sanya-latest --yes --cleanup-tag || true
          gh release create sanya-latest Sanya.apk --title "Санёк — приложение для планшета (сборка ${{ github.run_number }})" --notes "Скачайте Sanya.apk на планшет и установите."
