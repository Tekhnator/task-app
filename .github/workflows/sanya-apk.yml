name: Sanya APK
on:
  push:
    branches: [main]
    paths: ['sanya-android/**', '.github/workflows/sanya-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build APK
        run: gradle -p sanya-android assembleRelease --no-daemon --stacktrace
      - run: cp sanya-android/app/build/outputs/apk/release/app-release.apk Sanya.apk
      - name: Publish release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete sanya-latest --yes --cleanup-tag || true
          gh release create sanya-latest Sanya.apk --title "Санёк — приложение для планшета (сборка ${{ github.run_number }})" --notes "Скачайте Sanya.apk на планшет и установите."
